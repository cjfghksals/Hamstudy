<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 230px; padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a; color: #dde;
    }
    .title {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 14px;
      font-size: 1rem; font-weight: 700; color: #a5b4fc;
    }
    .status-row { display: flex; align-items: center; gap: 9px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #444; flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.on { background: #4ade80; box-shadow: 0 0 7px #4ade8088; }
    .status-text { font-size: 0.84rem; }
    .hint {
      margin-top: 12px; font-size: 0.75rem; color: #555; line-height: 1.6;
      border-top: 1px solid rgba(255,255,255,0.07); padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="title">🐹 햄스터디 도우미</div>
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="status">확인 중...</span>
  </div>
  <div class="hint" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
